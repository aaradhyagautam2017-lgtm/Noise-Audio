  tokens:
    description: Semantic color tokens with light/dark modes. alias:<name> points into the color collection.
    usage_source: 'Figma frame "Token Visualization" (2035:458), tokenDescription column. The four Ios/* tokens have no documentation card in that frame, so they carry no usage text.'
    modes:
    - light
    - dark
    variables:
      background/canvas:
        light: alias:gray/1100
        dark: alias:gray/100
        usage: Used as the page background color.
      background/surface:
        light: alias:gray/1000
        dark: alias:gray/200
        usage: Used for cards, tiles, bottom sheets, and content surfaces elevated above the page background.
      background/surface/green:
        light: alias:green/100
        dark: alias:green/900
        usage: Used for success-related cards, banners, and informational surfaces.
      background/surface/red:
        light: alias:red/100
        dark: alias:red/900
        usage: Used for failure, error, and warning-related surfaces.
      background/surface/raised+2:
        light: alias:gray/900
        dark: alias:gray/300
        usage: Used for loading, processing, and temporary system-state surfaces.
      background/surface/raised+5:
        light: alias:gray/500
        dark: alias:gray/700
        usage: Used for toast messages and temporary feedback surfaces.
      background/surface/raised+6:
        light: alias:gray/400
        dark: alias:gray/800
        usage: Used for notification chin and highest non-modal elevated surfaces.
      text/primary:
        light: alias:gray/400
        dark: alias:gray/1000
        usage: Used for page titles, device names, primary content, and critical information.
      text/secondary:
        light: alias:gray/600
        dark: alias:gray/600
        usage: Used for supporting information related to primary content.
      text/tertiary:
        light: alias:gray/700
        dark: alias:gray/700
        usage: Used for labels, metadata, helper text, and section headings.
      text/disabled:
        light: alias:gray/800
        dark: alias:gray/400
        usage: Used for disabled controls and unavailable content.
      text/inverted:
        light: alias:gray/1000
        dark: alias:gray/200
        usage: Used on primary CTAs, toasts, notification chins, and elevated surfaces.
      text/cta:
        light: alias:gray/200
        dark: alias:gray/1000
        usage: Used for secondary CTA labels and interactive actions.
      text/colored/red:
        light: alias:red/400
        dark: alias:red/400
        usage: Used for error messages, destructive information, and failure states.
      text/colored/green:
        light: alias:green/400
        dark: alias:green/400
        usage: Used for success messages and positive system feedback.
      text/colored/amber:
        light: alias:amber/400
        dark: alias:amber/400
        usage: Used for pending, provisional, cautionary, and warning information.
      text/colored/gray:
        light: alias:gray/200
        dark: alias:gray/1000
        usage: Used for neutral status information and non-semantic state indicators.
      icon/primary:
        light: alias:gray/400
        dark: alias:gray/900
        usage: Used for primary informational icons and leading visual indicators.
      icon/disable:
        light: alias:gray/800
        dark: alias:gray/400
        usage: Used for disabled or unavailable icon actions.
      icon/red:
        light: alias:red/300
        dark: alias:red/300
        usage: Used for destructive, failure, and critical-state icons.
      icon/green:
        light: alias:green/300
        dark: alias:green/300
        usage: Used for success-state and completion icons.
      icon/inverted:
        light: alias:gray/1000
        dark: alias:gray/200
        usage: Used for icons placed on elevated and dark surfaces.
      icon/cta:
        light: alias:gray/200
        dark: alias:gray/1000
        usage: Used for interactive icons inside CTAs and surface actions.
      button/primary/background:
        light: alias:gray/300
        dark: alias:gray/1000
        usage: Used for the highest-priority action on a screen.
      button/primary/pressed:
        light: alias:gray/500
        dark: alias:gray/600
        usage: Used during active press interaction.
      button/primary/disabled:
        light: alias:gray/1000
        dark: alias:gray/200
